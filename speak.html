<!DOCTYPE html>
<html>
<head>
    <title>Voice Farming Assistant</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef8f0;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ccc;
        }

        select {
            padding: 12px;
            margin: 15px;
            font-size: 16px;
        }

        button {
            padding: 15px 30px;
            background: #16843b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔊 Voice Farming Assistant</h1>

    <p>Select language and click Speak Now.</p>

    <select id="language">
        <option value="en-IN">English</option>
        <option value="te-IN">Telugu</option>
        <option value="hi-IN">Hindi</option>
    </select>

    <br><br>

    <button id="speakButton">🎤 Speak Now</button>

    <div id="status">
        Click the button to start speaking.
    </div>

    <div id="result"></div>

</div>


<script>

const button = document.getElementById("speakButton");
const status = document.getElementById("status");
const result = document.getElementById("result");
const language = document.getElementById("language");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    status.innerHTML =
        "❌ Speech Recognition not supported. Please use Google Chrome.";

} else {

    const recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;

    button.addEventListener("click", function () {

        recognition.lang = language.value;

        status.innerHTML =
            "🎤 Listening... Please speak now.";

        result.innerHTML = "";

        try {
            recognition.start();
        } catch (error) {
            console.log(error);
        }
    });


    recognition.onstart = function () {

        status.innerHTML =
            "🎤 Microphone ON — Speak now!";
    };


    recognition.onresult = function (event) {

        const text =
            event.results[0][0].transcript;

        result.innerHTML =
            "<b>You said:</b> " + text;

        status.innerHTML =
            "✅ Successfully captured your voice!";

    };


    recognition.onerror = function (event) {

        console.log("Error:", event.error);

        if (event.error === "not-allowed") {

            status.innerHTML =
                "❌ Microphone permission denied. Please click Allow.";

        } else if (event.error === "no-speech") {

            status.innerHTML =
                "❌ No voice detected. Please speak clearly.";

        } else {

            status.innerHTML =
                "❌ Voice error: " + event.error;
        }
    };


    recognition.onend = function () {

        button.innerHTML = "🎤 Speak Now";

    };

}

</script>

</body>
</html>
